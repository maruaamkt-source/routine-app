<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · Routine</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0e0e0e; color: #e8e2d6; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
    h1 { font-family: Georgia, serif; font-weight: 400; margin: 0 0 8px; }
    p { color: #8a8478; margin: 0 0 20px; font-size: 14px; }
    button { background: #e0652b; color: #0e0e0e; border: 0; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 500; }
  </style>
</head>
<body>
  <div>
    <h1>Você está offline</h1>
    <p>Esta tela ainda não foi aberta com internet neste aparelho.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
